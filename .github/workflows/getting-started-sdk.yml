name: getting-started-sdk

# GitLab mirrors to GitHub; this adds the Windows run GitLab has no runner for.
on:
    push:
        paths:
            [
                "getting-started-sdk/**",
                ".github/workflows/getting-started-sdk.yml",
            ]
    pull_request:
        paths:
            [
                "getting-started-sdk/**",
                ".github/workflows/getting-started-sdk.yml",
            ]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: getting-started-sdk

jobs:
    tests:
        name: tests (${{ matrix.os }}, py${{ matrix.python }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                # Oldest supported (Ubuntu 22.04's python3) and newest release.
                python: ["3.10", "3.14"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python }}
            - run: python -m pip install --quiet pytest pytest-cov
            - run: python -m pytest tests -q -rs --cov=scripts --cov-report=term --cov-fail-under=90

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            # Same pinned rules as the GitLab sdk-ruff job.
            - run: python -m pip install --quiet ruff==0.17.0
            - run: ruff check --isolated --target-version py310 --select E4,E7,E9,F --output-format github scripts tests
            - run: shellcheck --version && shellcheck -S warning ubx-*.sh scripts/matter_vendor/*.sh
