stages:
  - test

# Branch pipelines on push; switch to MR pipelines once an MR is open, never both.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Getting Started SDK launcher, Matter driver and module-config tests.
# Hermetic: no vendor SDK, toolchain or hardware needed.
.sdk-tests:
  stage: test
  before_script:
    - cd getting-started-sdk
    - python -m pip install --quiet pytest pytest-cov
  script:
    - python -m pytest tests -q -rs --junitxml=report.xml --cov=scripts --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=90
  coverage: '/^TOTAL.*\s(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: getting-started-sdk/report.xml
      coverage_report:
        coverage_format: cobertura
        path: getting-started-sdk/coverage.xml
  rules:
    - changes: [getting-started-sdk/**/*, .gitlab-ci.yml]

sdk-tests:
  extends: .sdk-tests
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      # Oldest supported (Ubuntu 22.04's python3) and newest release.
      - PYTHON_VERSION: ["3.10", "3.14"]

# Real bugs only (pyflakes + core pycodestyle errors). Rules and version are pinned
# so a new ruff release cannot turn the pipeline red. Same command in GitHub Actions.
sdk-ruff:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install --quiet ruff==0.17.0
    - cd getting-started-sdk
    - ruff check --isolated --target-version py310 --select E4,E7,E9,F scripts tests
  rules:
    - changes: [getting-started-sdk/**/*, .gitlab-ci.yml]

sdk-shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:v0.11.0
  script:
    - cd getting-started-sdk
    - shellcheck -S warning ubx-*.sh scripts/matter_vendor/*.sh
  rules:
    - changes: [getting-started-sdk/**/*, .gitlab-ci.yml]
